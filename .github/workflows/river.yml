name: Build the River

# Polls the member feeds listed in sources.yml and rewrites docs/river.md.
#
# Hourly rather than every few minutes: it is courteous to the members' servers,
# it keeps well inside the free Actions allowance, and news in a land-steward
# community is not a live ticker. When members' sites support rssCloud push we
# can do better than polling — see docs/wordpress-spec.md.

on:
  schedule:
    - cron: "17 * * * *"   # hourly, off the hour to avoid the crowded :00 slot
  workflow_dispatch:        # lets a human run it on demand from the Actions tab
  push:
    branches: [main]
    paths:
      - "sources.yml"       # a newly agreed member appears without waiting an hour
      - "scripts/build-river.py"

permissions:
  contents: write

concurrency:
  group: river
  # A superseded river build is harmless — the next run regenerates the whole
  # page from scratch, so there is nothing to lose by cancelling an older one.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the river page
        run: python3 scripts/build-river.py

      - name: Publish to the river branch
        run: |
          git config user.name  "barlavento.eco river"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # WHY THIS DOES NOT COMMIT TO main
          #
          # main is a protected branch: changes must arrive through a pull
          # request. That is a deliberate rule — on a public commons the
          # reviewable trail IS the decision record we promise. But it means a
          # robot cannot push here, and a robot opening a pull request every
          # hour would bury the real ones.
          #
          # So the generated page goes to its own branch, `river`. main stays
          # human-reviewed; the machine output lives where it cannot clutter it.
          #
          # The branch is DATA, NOT HISTORY. Every run regenerates the whole
          # page from scratch, so yesterday's version is of no interest. We
          # publish it as a single-commit orphan branch and force-push, which
          # is why there is no retry loop here: with no shared history there is
          # no race to lose and no conflict to resolve.
          #
          # (The previous version of this step retried three times and reported
          # a push rejection as "another run got there first". That message was
          # wrong and sent a diagnostician looking for a race — the real cause
          # was branch protection, and it failed every run for three weeks
          # before anyone noticed.)

          # Republish only when the content actually moved. The page carries an
          # "Updated ... UTC" line that changes every run, so ignore that line
          # when deciding whether anything is different.
          git fetch -q origin river || true
          if git rev-parse -q --verify refs/remotes/origin/river >/dev/null 2>&1; then
            git show origin/river:docs/river.md 2>/dev/null \
              | sed '/^\*Updated /d' > /tmp/river-prev.md || : > /tmp/river-prev.md
            sed '/^\*Updated /d' docs/river.md > /tmp/river-curr.md
            if cmp -s /tmp/river-prev.md /tmp/river-curr.md; then
              echo "No change in river content — not republishing."
              exit 0
            fi
          fi

          git checkout -q --orphan river-build
          git reset -q
          git add -f docs/river.md
          git commit -q -m "River: refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push -q --force origin river-build:river
          echo "Published to the river branch."
