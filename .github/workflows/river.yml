name: Build the River

# Polls the member feeds listed in sources.yml and rewrites docs/river.md.
#
# Hourly rather than every few minutes: it is courteous to the members' servers,
# it keeps well inside the free Actions allowance, and news in a land-steward
# community is not a live ticker. When members' sites support rssCloud push we
# can do better than polling — see docs/wordpress-spec.md.

on:
  schedule:
    - cron: "17 * * * *"   # hourly, off the hour to avoid the crowded :00 slot
  workflow_dispatch:        # lets a human run it on demand from the Actions tab
  push:
    branches: [main]
    paths:
      - "sources.yml"       # a newly agreed member appears without waiting an hour
      - "scripts/build-river.py"

permissions:
  contents: write

concurrency:
  group: river
  # A superseded river build is harmless — the next run regenerates the whole
  # page from scratch, so there is nothing to lose by cancelling an older one.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the river page
        run: python3 scripts/build-river.py

      - name: Commit if it changed
        run: |
          git config user.name  "barlavento.eco river"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # docs/river.md is generated, never hand-edited, so on a push race the
          # correct resolution is always "take theirs, then rebuild" — no merge,
          # no conflict. Two runs can overlap when sources.yml is edited near the
          # top of the hour, which is exactly when a new member is added.
          for attempt in 1 2 3; do
            if [ -z "$(git status --porcelain docs/river.md)" ]; then
              echo "No change — nothing to commit."
              exit 0
            fi
            git add docs/river.md
            git commit -q -m "River: refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
            if git push -q; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — another run got there first. Rebuilding."
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 scripts/build-river.py
          done
          echo "::error::Could not push after 3 attempts."
          exit 1
